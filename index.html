const book = document.querySelector("#book");
for (let i=0;i<pages.length;) {
  const solo = i===0 || i===pages.length-1;
  const spread = document.createElement("div");
  spread.className = solo ? "spread solo" : "spread";
  for (let j=0;j<(solo ? 1 : 2);j++,i++) {
    const [name,section,body,kind=""] = pages[i];
    const n = number(i+1);
    spread.insertAdjacentHTML("beforeend",`<article id="p${n}" class="page ${kind}" aria-label="第 ${i+1} 页 ${name}"><div class="leaf">${kind==="closing" ? "" : `<div class="running"><strong>鲸云智能</strong><span>${section || "产品手册 · 样册"}</span></div>`}${body}<footer class="foot"><span>羲和企业智能基座</span><span>${n} / 24</span></footer></div></article>`);
    document.querySelector("#jump").add(new Option(`${n} · ${name}`,`p${n}`));
  }
  book.append(spread);
}
document.querySelector("#jump").addEventListener("change", event => {
  location.hash=event.target.value;
});
function syncJump() {
  const id=location.hash.slice(1);
  if (document.getElementById(id)?.classList.contains("page")) document.querySelector("#jump").value=id;
}
window.addEventListener("hashchange",syncJump);
syncJump();
document.querySelector("#print").addEventListener("click",()=>window.print());
